[project]
name = "model-rollout-gate"
version = "0.1.0"
description = "Paired offline champion–challenger evaluation for binary classifiers"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pydantic>=2.11,<3"]

[project.scripts]
rollout-gate = "rollout_gate.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "scikit-learn>=1.6,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["rollout_gate"]
